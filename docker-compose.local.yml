# Local override: publish ports, no Dokploy Traefik network.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  mongodb:
    ports:
      - '27017:27017'
    networks:
      - default

  app:
    ports:
      - '3000:3000'
    networks:
      - default

networks:
  dokploy-network:
    external: false
    name: trt-newsroom-local
